[project]
name = "spark-dash-agent"
version = "0.1.0"
description = "Per-node metrics agent for spark-dash (GB10 / DGX Spark aware)"
requires-python = ">=3.12"
dependencies = [
    "spark-dash-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "psutil>=6.1",
    "httpx>=0.28",
    "nvitop>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_dash_agent"]
