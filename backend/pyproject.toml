[project]
name = "spark-dash-backend"
version = "0.1.0"
description = "Central API for spark-dash: Prometheus-backed history plus a live WebSocket view"
requires-python = ">=3.12"
dependencies = [
    "spark-dash-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_dash_backend"]
