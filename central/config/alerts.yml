# Alert rules.
#
# Two principles throughout:
#
# 1. Every alert has a `for:` duration. A GPU touching 90C for ten seconds is
#    weather; ten minutes is a fault. Alerting on instantaneous values is how
#    you train yourself to ignore alerts.
#
# 2. Thresholds live here rather than being inherited from the agent's health
#    rollup, so tuning them is a config change on the monitoring VM instead of
#    a redeploy of every node.
#
# Several values are still uncalibrated for this hardware — see issue #30. They
# are marked [CALIBRATE] and chosen conservatively, on the reasoning that an
# alert which never fires is a smaller problem than one that fires constantly
# and teaches you to dismiss it.

groups:
  # ---------------------------------------------------------------- liveness
  - name: liveness
    rules:
      - alert: NodeAgentDown
        expr: up{job="spark-dash-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent on {{ $labels.node }} is not responding"
          description: >-
            No metrics from {{ $labels.node }} for 2 minutes. The node may be
            down, or just its agent container. Check `docker ps` on the node —
            if node-exporter is still up, it's the agent.

      - alert: AgentCollectionFailing
        expr: increase(sparkdash_agent_collect_failures_total[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent collection on {{ $labels.node }} keeps raising"
          description: >-
            Snapshot collection has failed more than 3 times in 10 minutes. The
            agent is still serving — a failed collection deliberately keeps the
            previous snapshot rather than returning an error, because a stale
            reading beats Prometheus recording nothing — so this is invisible
            without watching for it. That is the whole reason this rule exists.

            Distinct from AgentSnapshotStale, which fires when collection is too
            SLOW. This one fires when it is RAISING, and the two want different
            answers: slow is usually a runtime endpoint that stopped answering,
            while raising is usually the agent itself — NVML, procfs, or a
            collector hitting something it did not expect.

            Check the agent's logs for "snapshot collection failed"; the
            traceback names the collector. `sparkdash_agent_collections_total`
            rising alongside means it is failing intermittently rather than
            wholesale.

      - alert: AgentSnapshotStale
        expr: sparkdash_agent_snapshot_age_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent on {{ $labels.node }} is serving stale data"
          description: >-
            The agent is answering, but the snapshot it returns was collected
            over 30s ago — so its metrics are real and its timestamps are not.
            Almost always a runtime endpoint that accepts connections and then
            does not answer, which is what a llama.cpp router does while it
            loads a model.

            THIS RULE EXISTS BECAUSE NodeAgentDown NO LONGER COVERS IT. Before
            the agent served stale data through a stall, collection blocked and
            the scrape failed, so `up` went 0 and NodeAgentDown fired. The agent
            now answers immediately no matter how slow collection is — which is
            the fix — and that made the old symptom invisible. Freshness has to
            be reported rather than inferred from the scrape working.

            Check `sparkdash_agent_collect_duration_seconds` for how long
            collection is taking, and `sparkdash_agent_collect_failures_total`
            for whether it is failing outright rather than merely slow.

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter on {{ $labels.node }} is not responding"
          description: >-
            Host metrics are missing for {{ $labels.node }}. GPU and model data
            may still be arriving via the agent.

      - alert: RouterUnreachable
        expr: sparkdash_llama_router_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "llama.cpp router {{ $labels.router }} unreachable from {{ $labels.node }}"
          description: >-
            The agent can't reach this router. Models it hosts are invisible to
            the dashboard, though they may still be serving traffic fine.

      - alert: CollectorFailing
        expr: sparkdash_collector_errors == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.collector }} collector failing on {{ $labels.node }}"
          description: >-
            This collector has been erroring for 15 minutes, so that section of
            the dashboard is blank rather than wrong. Check the agent logs.

      # A stale agent has twice presented as a missing feature rather than as a
      # stale agent, costing a debugging round trip each time.
      #
      # Nothing converges the nodes on its own: images are pinned per stack and
      # rollout is a manual `up -d` on each node. So a node missed during a
      # rollout stays skewed indefinitely rather than catching up overnight,
      # which makes this alert the only thing that notices.
      #
      # The inner count collapses to one series per distinct build; the outer
      # counts how many distinct builds exist at all. More than one means the
      # nodes disagree.
      #
      # 30m rather than minutes: nodes legitimately differ while a rollout is in
      # progress. This is for a node that is STUCK, not one mid-update.
      # MONITORING THE MONITOR. On 2026-08-16 this VM rebooted twice with its
      # clock ~3h fast; NTP stepped it back, and every subsequent sample was
      # older than the TSDB head, so Prometheus rejected ALL of them from ALL
      # targets — including itself — with "out of bounds". Nothing was recorded
      # for half an hour and the dashboard showed a confident "nothing firing",
      # because Alertmanager was perfectly reachable. The reassuring state and
      # the blind state were indistinguishable.
      #
      # `absent()` is the load-bearing half. Once appends stop, `up` goes stale
      # and disappears within ~5 minutes, at which point a plain staleness
      # comparison silently returns no data and CANNOT fire — the exact trap
      # this repo keeps finding. The two halves cover each other: the timestamp
      # check catches a slow stall while the series still exists, `absent()`
      # catches it once the series is gone.
      #
      # This still fires with appends broken: rule evaluation and Alertmanager
      # notification run from in-memory state, not from the TSDB write path.
      - alert: PrometheusNotIngesting
        expr: absent(up{job="prometheus"}) or (time() - timestamp(up{job="prometheus"})) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus has stopped recording"
          description: >-
            No new samples for over 5 minutes. Every other alert is blind while
            this is true, and the dashboard cannot tell you so on its own.
            Check `docker logs sparkdash-prometheus` for "out of bounds" (a
            clock step: the TSDB head is ahead of now) or a full disk.

      # The narrower signal, for when rejection is PARTIAL — one target's
      # samples refused while the rest land. Useless when everything is
      # rejected, since this counter is scraped from Prometheus itself and
      # would be refused too; that case is what PrometheusNotIngesting is for.
      - alert: PrometheusRejectingSamples
        expr: increase(prometheus_target_scrapes_sample_out_of_bounds_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is discarding samples as out of bounds"
          description: >-
            Samples are being rejected for having timestamps outside the
            acceptable window — almost always a clock step on the monitoring
            host or on a scrape target. History has gaps for as long as this
            lasts.

      - alert: AgentBuildSkew
        expr: count(count by (build) (sparkdash_agent_build_info)) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Nodes are running different agent builds"
          description: >-
            More than one agent build has been reporting for 30 minutes, which
            is longer than a rollout should take. Check which node is behind
            with: count by (build, node) (sparkdash_agent_build_info)

  # ------------------------------------------------------------------- thermal
  - name: thermal
    rules:
      # These compare against the node's OWN bands rather than a number typed
      # in here, so there is one source of truth and the rules self-calibrate to
      # whatever silicon is present. The agent derives them from the hardware:
      # the GPU's from NVML's slowdown threshold (86C on GB10, with shutdown at
      # 90C), the CPU's from the thermal zone's critical trip (104C).
      #
      # The hardcoded numbers these replaced were wrong in both directions. The
      # old critical waited for 94C on a part that powers itself off at 90C, so
      # it could never fire; the old warning at 88C only tripped after the GPU
      # had already begun throttling at 86C.
      # THESE SENSORS SPIKE; THEY DO NOT PLATEAU. Measured over 7 days,
      # 2026-08-28, and it invalidated how both warning rules were written.
      #
      # In sparky's hottest 40 minutes of the week the CPU was above its band
      # 51% of the time, oscillating between 88.1 and 95.1 — and the longest
      # CONTINUOUS run above it was 120 seconds, against a 10 minute hold. Every
      # dip reset the timer.
      #
      # The result was two rules that could not fire. CpuTemperatureHigh reached
      # `pending` 463 times in a week and fired 0 times; GpuTemperatureHigh 891
      # and 0. That is worse than having no rule, because the dashboard showed
      # activity that never became a notification.
      #
      # Both now smooth the input rather than shorten the hold. Shortening it
      # was the tempting fix and is wrong: a 2 minute hold clears the observed
      # runs, so it would fire on single transient spikes instead.
      #
      # The CRITICAL rules below are deliberately left alone. They also go
      # pending and never fire, and for them that is correct — the GPU touches
      # its 86C slowdown for a handful of 15s samples and backs off, which is a
      # transient the hold is supposed to filter. A rule that stays quiet
      # because the condition genuinely does not happen is not the same as one
      # that cannot fire when it does.
      - alert: GpuTemperatureHigh
        # Same smoothing as CpuTemperatureHigh, and the same reason: 891 pending
        # events in seven days and not one of them fired.
        expr: >-
          avg_over_time(
            (
              sparkdash_gpu_temperature_celsius
              >= bool on(node) sparkdash_gpu_temp_warning_celsius
            )[10m:15s]
          ) > 0.5
        # LONGER than the CPU's hold, deliberately. The GPU is the part that is
        # supposed to run hot, and it earns its warm minutes doing the node's
        # actual job — at 10m this fires 5x/week on sparky and would be tuned
        # out by the second week. 15m puts it at 3, which is the rate at which a
        # phone notification still means something.
        #
        # It can also afford to be late: GpuThrottled covers the consequence at
        # critical severity, so this is the leading indicator rather than the
        # only one.
        for: 15m
        labels:
          severity: warning
        annotations:
          # $value is now a FRACTION of the window, not a temperature — saying
          # "at 1C" is what the old wording would have printed.
          summary: "GPU on {{ $labels.node }} above its limit {{ $value | humanizePercentage }} of the last 10min"
          description: >-
            Approaching the point where this GPU throttles itself. Still
            performing normally, but with little headroom left — check airflow
            and the workload mix.

      # At this point the hardware is slowing itself down, so the cost is real
      # and measurable rather than anticipated.
      - alert: GpuTemperatureCritical
        expr: >-
          sparkdash_gpu_temperature_celsius
          >= on(node) sparkdash_gpu_temp_critical_celsius
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GPU on {{ $labels.node }} at {{ $value | printf \"%.0f\" }}C"
          description: >-
            At or above this GPU's slowdown threshold — it is throttling to
            protect itself, so throughput is already degraded. Shutdown follows
            a few degrees higher.

      # The CPU had NO alert rule at all, despite feeding node health and
      # despite being the hotter of the two components in practice.
      - alert: CpuTemperatureHigh
        # SMOOTHED, not thresholded. See the note above this group: this sensor
        # oscillates across its own band every few samples, so `temp >= band`
        # with a hold can never be satisfied. This asks how much of the last ten
        # minutes was spent above the band instead, which is the question a
        # reader actually has, and it is immune to the flapping by construction.
        #
        # >0.5 rather than something stricter because >0.8 NEVER OCCURRED in
        # seven days on any node — a stricter bar would have been a second rule
        # that cannot fire. Measured, not chosen.
        expr: >-
          avg_over_time(
            (
              sparkdash_cpu_temperature_celsius
              >= bool on(node) sparkdash_cpu_temp_warning_celsius
            )[10m:15s]
          ) > 0.5
        # On top of the 10m window above, so this is 20 minutes of mostly-hot.
        # Calibrated against 7 days: 2 alerts/week, both on sparky. At 5m it
        # would be 3/week and at 15m only 1.
        for: 10m
        labels:
          severity: warning
        annotations:
          # $value is now a FRACTION of the window, not a temperature — saying
          # "at 1C" is what the old wording would have printed.
          summary: "CPU on {{ $labels.node }} above its limit {{ $value | humanizePercentage }} of the last 10min"
          description: >-
            Sustained well above normal working temperature and closing on the
            trip point where the kernel powers the machine off. Check airflow.

      - alert: CpuTemperatureCritical
        expr: >-
          sparkdash_cpu_temperature_celsius
          >= on(node) sparkdash_cpu_temp_critical_celsius
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU on {{ $labels.node }} at {{ $value | printf \"%.0f\" }}C"
          description: >-
            Within a few degrees of the kernel's critical trip, which powers
            the machine off without warning. Cooling failure ramps fast — treat
            this as immediate.

      # A band that fell back rather than being read from the hardware is a
      # guess, and a guess is what got the old thresholds wrong. Worth knowing
      # about, but not at 2am.
      - alert: TemperatureBandsNotDerived
        expr: sparkdash_temp_band_source_info{derived="fallback"} == 1
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.component }} bands on {{ $labels.node }} are a fallback guess"
          description: >-
            The hardware didn't report a limit for this component, so generic
            fallback values are in force. Alerts still work, but the thresholds
            aren't calibrated to this part.

  # -------------------------------------------------------------------- clocks
  - name: clocks
    rules:
      # Load-gated at the source: the agent only reports THROTTLED when the GPU
      # is actually working, so this can't fire on an idle node dropping clocks
      # for power management.
      - alert: GpuThrottled
        expr: sparkdash_gpu_clock_state{state="THROTTLED"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU on {{ $labels.node }} throttled under sustained load"
          description: >-
            Clock has stayed below the throttle threshold while the GPU is
            busy. On GB10 this usually means power delivery rather than heat —
            check the PSU and the power cable before assuming thermal.

      - alert: GpuClockLocked
        expr: sparkdash_gpu_clock_state{state="LOCKED"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "GPU on {{ $labels.node }} has an externally applied clock cap"
          description: >-
            Someone ran `nvidia-smi -lgc`, or a previous session left a cap in
            place. Deliberate, but easy to forget about — reset with
            `nvidia-smi -rgc`.

      # Covers the gap THROTTLED is too coarse to see.
      #
      # THROTTLED fires below ~1400MHz, which on a GPU targeting 2418 means a
      # 42% loss before anything is said. Measured across three days the clock
      # never left 2359-2483MHz (97.6%-102.7% of target), so a sustained drop to
      # 85% is well outside anything this node does normally, while still being
      # far above the catastrophic range where THROTTLED lives.
      #
      # WARNING, not critical, and deliberately so: the band between "normal"
      # and "known-degraded" has never been observed here, so this reports
      # something unusual rather than asserting a fault. That uncertainty is the
      # whole reason it exists — degradation in this range is currently invisible.
      - alert: GpuClockBelowTarget
        expr: >-
          (
            sparkdash_gpu_clock_mhz < on(node) (sparkdash_gpu_clock_target_mhz * 0.85)
          ) and on(node) (sparkdash_gpu_utilization_percent > 30)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU on {{ $labels.node }} running below its target clock"
          description: >-
            Sustained below 85% of the clock this GPU targets for compute, while
            busy. Not the catastrophic range GpuThrottled watches for — this is
            the quieter degradation that costs throughput without looking like a
            fault. Check power delivery and thermals.

  # -------------------------------------------------------------------- memory
  - name: memory
    rules:
      # [CALIBRATE] The PSI bands are uncalibrated guesses (see #30). PSI is
      # the signal that catches contention before swap thrashing, so it's worth
      # having even approximate.
      - alert: MemoryPressureHigh
        expr: sparkdash_psi_memory_state{state="HIGH"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory pressure HIGH on {{ $labels.node }}"
          description: >-
            Tasks are stalling on memory. On GB10 the pool is shared with image
            generation, so check what else is running before blaming the models.

      - alert: MemoryPressureCritical
        expr: sparkdash_psi_memory_state{state="CRITICAL"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Memory pressure CRITICAL on {{ $labels.node }}"
          description: >-
            Sustained stalling. The node is likely close to OOM — this is the
            state that precedes a freeze rather than following one.

      # CAPACITY, not pressure. Renamed from MemoryHighWithSwap, which paired
      # this with `swap_used > 0` on the theory that the combination meant the
      # kernel had run out of better options.
      #
      # Measurement killed that theory. swap_used is a LEVEL, not a flow: pages
      # evicted during some past squeeze sit in swap indefinitely because Linux
      # never faults them back proactively. On the GX10 it sat unchanged at
      # 6.13-6.40 GiB across 24h while memory never passed 42%, so the conjunct
      # was ~always true -- a no-op that made the rule look more specific than
      # it was.
      #
      # SECOND CORRECTION, 2026-08-21: the level itself was the wrong question.
      #
      # `MemoryNearlyFull` fired at >85% used and could not be cleared on a node
      # doing exactly what it was built for. `danflashes` holds one 193 GiB
      # model across two nodes, so both sit at ~87% indefinitely, and the rule's
      # own description conceded it -- "a node deliberately full of weights
      # looks like this". It was being silenced by hand every day, which is the
      # same loop W broke for interfaces and Z1 broke for cluster workers.
      #
      # Measured before replacing it. Non-model memory -- what is used and NOT
      # explained by resident model weights -- separates the two cases cleanly:
      #
      #   sparketa  87.8% used   96.8 GiB models    8.2% non-model
      #   sparkjr   86.7% used   96.8 GiB models    7.2% non-model
      #   sparky    44.5% used   27.5 GiB models   21.9% non-model
      #
      # The old rule fired on the two nodes whose memory was MOST accounted for
      # and stayed quiet on the one with three times the unexplained footprint.
      # Over 7 days, restricted to samples where attribution exists, non-model
      # never exceeded 25.8% on any node.
      #
      # 40% is therefore ~1.5x the worst observed. PROVISIONAL: 7 days of one
      # node plus hours of the other two, not a derived constant like the
      # temperature bands. Revisit once the cluster has run a fuller mix.
      #
      # THE `or` BRANCH IS A WITNESS, NOT A CONSTANT ZERO. It supplies 0 models
      # only when the GPU collector RAN and found no LLM process, which is
      # genuinely zero. When GPU collection fails there is no witness, so no
      # series and no alert -- because "attribution is missing" must not
      # manufacture a memory alert. Measured: with a naive `or 0` fallback,
      # sparky's apparent non-model peak was 39.4%, entirely from windows where
      # process data was absent; with the witness it is 25.8%. `CollectorFailing`
      # is what reports the collection failure itself.
      #
      # Harm, as opposed to headroom, is covered twice already: MemoryPressure
      # High/Critical read PSI, and SwapThrashing reads swap I/O. This rule is
      # the remaining question -- is the memory explained -- and a node full of
      # weights is not a fault.
      - alert: UnexplainedMemoryUse
        expr: >-
          100 * (
            sum by (node) (sparkdash_memory_used_bytes)
            - (
              sum by (node) (sparkdash_gpu_process_memory_bytes{runtime=~"vllm|llama.cpp|sglang|atlas"})
              or (0 * sum by (node) (sparkdash_gpu_utilization_percent))
            )
          ) / sum by (node) (sparkdash_memory_total_bytes) > 40
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }}: memory not explained by model weights"
          description: >-
            Over 40% of the unified pool is held by something other than
            resident model weights. A node full of weights is expected and does
            not trigger this; a node full of something nobody can name is worth
            looking at. Check the GPU process table for a runtime holding memory
            it should have released, and the host for a non-GPU leak. Held for
            an hour before firing, so an agent restart or a brief attribution
            gap cannot trip it.

      # Swap I/O is the flow that swap_used isn't. On a unified-memory box
      # sustained swap-out means model weights heading to disk, which turns
      # inference latency into disk latency.
      #
      # Rate rather than level, and both directions: swap-IN matters as much
      # here, since faulting weights back from disk is the stall you feel. The
      # GX10's 24h peaks were 18.6 pages/s in and 5.1 out, so this threshold
      # sits above ordinary background activity.
      - alert: SwapThrashing
        expr: >-
          rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained swap I/O on {{ $labels.instance }}"
          description: >-
            Pages have been moving between RAM and disk for 10 minutes. PSI will
            usually catch this too; this rule names the mechanism, which is what
            tells you it's memory rather than something else stalling.

      # An inference server running with nothing configured to collect from it
      # is a SILENCE, and a silence is what nobody notices: the node looks
      # healthy because everything being measured is healthy, while a container
      # holds GPU memory and reports no throughput, latency or queue depth.
      #
      # `for: 30m` rather than minutes — a server that has just been started is
      # legitimately unconfigured for as long as it takes someone to add it, and
      # paging on that would punish the normal workflow.
      - alert: UnmonitoredInferenceRuntime
        expr: sparkdash_unmonitored_runtime == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.runtime }} on {{ $labels.node }} is not being collected"
          description: >-
            A {{ $labels.runtime }} process is using the GPU but no endpoint is
            configured for it, so none of its throughput, queue depth or cache
            metrics reach the dashboard. Add it to that node's configuration.

  # ------------------------------------------------------------------- fabric
  # -------------------------------------------------------------- cluster
  #
  # Nodes pooled for distributed inference, compared against EACH OTHER. Every
  # rule above asks whether a node is healthy on its own terms; these ask
  # whether one member is holding the rest back, which is a question that only
  # exists once a model spans machines.
  #
  # WHY NOT COMPARE THROUGHPUT, the obvious approach: in tensor-parallel
  # inference only the head node has an API, so `sparkjr` publishes no
  # throughput at all. There is nothing per-node to compare on the inference
  # side, which is why these read hardware instead.
  #
  # WHY NOT COMPARE SM UTILISATION either: NCCL collectives BUSY-WAIT, so a node
  # stalled waiting on a straggling peer burns SM identically to one doing
  # useful work. Measured over 90 minutes on `danflashes`, both nodes peak at
  # 96% and track each other closely. SM says the cluster is busy; it cannot say
  # who is late.
  #
  # EVERYTHING HERE IS 15-MINUTE AVERAGED, and that is load-bearing rather than
  # smoothing for taste. Instantaneous spread across a HEALTHY pair, measured:
  #
  #             instantaneous          15-minute average
  #   clock     -117 .. +110 MHz       -4.7 .. +4.7 MHz
  #   temp       -13 .. +15 C          -1.2 .. +1.2 C
  #   power      -34 .. +56 W          -1.6 .. +1.6 W
  #
  # A threshold loose enough to survive the left column would miss any real
  # straggler; averaged, the same healthy pair collapses into a band ~25x
  # tighter. The thresholds below are roughly 10x the averaged band.
  #
  # PROVISIONAL. Roughly four hours of genuinely PAIRED data -- sparkjr joined
  # recently, and for most of the longer window the "cluster" was sparketa
  # compared against itself -- of which ~15% was busy. Revisit after a week.
  #
  # COMPARED AGAINST THE BEST PEER, not the cluster mean. With two nodes the
  # mean sits exactly between them, so each deviates by half the real gap and a
  # threshold would mean double what it appears to. Against max (clock) or min
  # (temperature) the number is the full gap at any cluster size.
  #
  # DIRECTIONAL BY CONSTRUCTION, because n=2 cannot vote. Two nodes disagreeing
  # says the pair differs, not which one is wrong; statistical outlier
  # detection needs n>=3 and `danflashes` has two. What rescues it is that each
  # metric's own semantics name the bad side -- a lower clock IS the node
  # setting the pace, a higher temperature IS the one about to throttle. Power
  # is deliberately absent for exactly this reason: lower can mean stalled or
  # merely idle, and higher can mean working hard or leaking, so it is worth
  # charting and not worth alerting on.
  - name: cluster
    rules:
      - alert: ClusterNodeClockLagging
        expr: >-
          (
            max by (cluster) (avg_over_time(sparkdash_gpu_clock_mhz{cluster=~".+"}[15m]))
            - on(cluster) group_right()
              avg_over_time(sparkdash_gpu_clock_mhz{cluster=~".+"}[15m])
          ) > 50
          and on(cluster) (count by (cluster) (sparkdash_node_up{cluster=~".+"}) > 1)
          and on(cluster) (
            max by (cluster) (
              avg_over_time(sparkdash_gpu_utilization_percent{cluster=~".+"}[15m])
            ) > 40
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} is clocking below its cluster"
          description: >-
            Sustained more than 50MHz under the fastest node in {{ $labels.cluster }}
            while the cluster was working. In tensor-parallel inference every step
            synchronises, so the slowest node sets the pace for the whole model and
            the head node's throughput drops without saying why. Check this node's
            temperature, its power cap, and whether an operator locked its clocks.
        # The busy gate matters: at idle, clocks drop independently and the
        # comparison is meaningless. Only ~15% of a measured 48h window had the
        # cluster working at all, so an ungated rule would spend most of its
        # life comparing idle noise.

      - alert: ClusterNodeRunningHot
        expr: >-
          (
            avg_over_time(sparkdash_gpu_temperature_celsius{cluster=~".+"}[15m])
            - on(cluster) group_left()
              min by (cluster) (
                avg_over_time(sparkdash_gpu_temperature_celsius{cluster=~".+"}[15m])
              )
          ) > 5
          and on(cluster) (count by (cluster) (sparkdash_node_up{cluster=~".+"}) > 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} runs hotter than its cluster"
          description: >-
            Sustained more than 5C above the coolest node in {{ $labels.cluster }},
            on identical hardware doing identical work. That is airflow, dust or
            placement rather than load, and it is the node that will throttle first
            — which in a pooled cluster slows the whole model. Distinct from
            GpuTemperatureHigh, which asks whether a node is near its own limit;
            this asks whether it is out of step with its peers, and fires long
            before the absolute threshold does.
        # NOT busy-gated, deliberately. A node that is hotter than its peers at
        # IDLE has a cooling problem that will only be worse under load, and
        # that is worth knowing before the next run rather than during it.

  - name: fabric
    rules:
      # TWO FILTERS, answering two different questions.
      #
      # `max_over_time(...) == 1` means "this link has been up at some point in
      # the window", which distinguishes a link that FAILED from one that was
      # never in service — the unused ports and wifi on a fresh node have never
      # been up, and `up == 0` alone would alert forever on them. Nothing to
      # maintain, and a newly cabled port starts being watched the moment it
      # first comes up.
      #
      # `sparkdash_network_monitored` is the part that history cannot supply:
      # INTENT. A port cabled to the switch as a test and then
      # deliberately unplugged HAS been up, so it reads as a failure to the
      # rule above and alerts indefinitely — observed 2026-08-21 on four ports
      # across sparketa and sparkjr, once every 24h, because the dashboard caps
      # silences at 24h precisely so a mute cannot outlive the memory of
      # setting it. That cap's own reasoning names the fix: a permanently
      # unwanted alert should have its target removed from CONFIGURATION. This
      # is that configuration — an ignore list per node in cluster.yml.
      #
      # `unless ... == 0` RATHER THAN `and ... == 1`, and the difference is the
      # failure mode. The flag only exists once every node runs an agent that
      # exports it, and `and == 1` matches nothing while it is missing — so a
      # node on a stale image, or a rules reload that lands before the rollout
      # finishes, would silently lose link alerting altogether. Measured
      # against live Prometheus 2026-08-21: `and == 1` returned 0 series where
      # `unless == 0` returned the 4 that were genuinely down. Set subtraction
      # removes only what is explicitly marked excluded, so an absent flag
      # leaves today's behaviour exactly as it was. Noisy beats silent, which
      # is the same reason the list excludes by name instead of selecting.
      #
      # `on (node, interface)` and not a bare `unless`: the agent's series
      # carry `job` and `instance` too, and full-label matching would subtract
      # nothing.
      #
      # Consequence worth knowing, unchanged: if a link stays down longer than
      # the window, the alert resolves itself even though the link is still
      # down. That is now the WEAKER of the two ways an alert stops, and the
      # honest one is the config.
      - alert: NetworkLinkDown
        expr: >-
          sparkdash_network_up == 0
          unless on (node, interface) sparkdash_network_monitored == 0
          and max_over_time(sparkdash_network_up[7d]) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.interface }} down on {{ $labels.node }}"
          description: >-
            An interface that was previously up has been down for 5 minutes.
            Check the cable, the switch port, and whether the driver reset.

      # The clustered pair does distributed inference over RoCE, so a fabric
      # port dropping is the difference between a working cluster and a node
      # that has silently left it.
      # ONE CABLE CARRIES BOTH, so this has to honour the same exclusion or
      # unplugging a port simply trades NetworkLinkDown for RdmaPortDown.
      # `sparkdash_rdma_port_monitored` is DERIVED by the agent from the netdev
      # the RoCE device is paired with, so there is one list to maintain rather
      # than two that can disagree.
      - alert: RdmaPortDown
        expr: >-
          sparkdash_rdma_port_active == 0
          unless on (node, device, port) sparkdash_rdma_port_monitored == 0
          and max_over_time(sparkdash_rdma_port_active[7d]) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RDMA port {{ $labels.device }} down on {{ $labels.node }}"
          description: >-
            A RoCE port that was previously ACTIVE has dropped. Distributed
            inference across the pair will fail or fall back to TCP — check
            `ibstat` and the switch.

      # Counters, so a rate: what matters is whether errors are still
      # accumulating, not the total since boot. A link can be up and still be
      # corrupting frames, which shows up as retransmits rather than an outage.
      # Excluded interfaces are quiet here too. A port nobody watches for being
      # DOWN is not a port anyone wants paged about marginal frames.
      - alert: NetworkErrorsRising
        expr: >-
          (
            rate(sparkdash_network_receive_errors_total[15m])
            + rate(sparkdash_network_transmit_errors_total[15m])
          ) > 0
          unless on (node, interface) sparkdash_network_monitored == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Errors accumulating on {{ $labels.interface }} ({{ $labels.node }})"
          description: >-
            The link is up but the error counters are still moving. Usually a
            marginal cable or transceiver — visible as throughput well below the
            negotiated rate long before it becomes an outage.

      - alert: RdmaErrorsRising
        expr: >-
          rate(sparkdash_rdma_errors_total[15m]) > 0
          unless on (node, device, port) sparkdash_rdma_port_monitored == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RDMA errors accumulating on {{ $labels.device }} ({{ $labels.node }})"
          description: >-
            Receive errors, discards or link-downs are still climbing on a RoCE
            port. Check the fabric before it degrades distributed inference.

  # --------------------------------------------------------------------- disk
  - name: disk
    rules:
      # Local filesystems only. The GX10 mounts two NFS shares with ~19TB free
      # whose capacity isn't this node's problem, and /boot/efi is small by
      # design and would read as nearly-full forever on a percentage rule.
      - alert: NodeDiskFillingUp
        expr: >-
          predict_linear(
            node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}[6h], 7 * 24 * 3600
          ) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} filling within a week"
          description: >-
            Projected from the last 6 hours of growth, so a one-off write won't
            trigger it. Model weights and ComfyUI outputs are the usual cause.

      # A WARNING TIER beneath NodeDiskLow's critical floor. 90% full is when
      # someone should go and look; 95% is when writes are about to start
      # failing, and that one stays critical.
      #
      # Same `avail / size` basis as its sibling and as the node card's
      # Used/Total, deliberately: three places describing "how full" with two
      # definitions is how a dashboard and an alert come to disagree.
      #
      # Model weights are why this matters here. /models sits on the LOCAL root
      # — 894 GB on a 3.6 TB filesystem when this was written, not on the NAS
      # the mount names suggest — so this is the disk whose filling stops
      # inference rather than merely losing logs.
      - alert: NodeDiskWarning
        expr: >-
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
          / node_filesystem_size_bytes < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is over 90% full"
          description: >-
            Still room, but not much, and model weights are the usual reason it
            moved. `for: 30m` because a build or a model download can cross 90%
            briefly and come back on its own; sustained is the signal.

      # A floor as well as a trend: a disk that fills slowly enough to evade
      # predict_linear still eventually fills.
      - alert: NodeDiskLow
        expr: >-
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
          / node_filesystem_size_bytes < 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} below 5% free"
          description: >-
            Little room left. Writes will start failing, and on the monitoring
            VM that means losing history rather than just space.

  # ------------------------------------------------------------- monitoring VM
  - name: monitoring
    rules:
      # Prometheus watching its own disk. If this fills, history stops and the
      # first you'd know is a gap in the charts.

      # INFRASTRUCTURE targets — nodes, exporters, Prometheus itself. These
      # never age out: the hardware still exists, so a target that stays down
      # is a fault however long it lasts, and letting it expire would blind
      # the dashboard to exactly the failure it exists to catch.
      - alert: PrometheusTargetScrapeFailing
        expr: up{job!~"vllm|sglang"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} on {{ $labels.instance }}"
          description: >-
            Persistent scrape failure. Distinct from the node being down —
            check the target is listening and reachable from the monitoring VM.

      # INFERENCE targets age out after 24h. An endpoint is configuration, not
      # hardware: taking a model down is almost always deliberate, and an alert
      # that cannot be cleared is one you learn to ignore — which costs you the
      # alerts that do matter.
      #
      # `max_over_time(up[24h]) == 1` means "was up at some point in the last
      # day", so once a target has been continuously down for 24h the alert
      # resolves itself. Same idiom as NetworkLinkDown, where it stops the
      # never-cabled ports alerting forever.
      #
      # THE TRADEOFF IS REAL AND DELIBERATE: a genuine crash ages out too.
      # Nothing here can distinguish "torn down on purpose" from "died and
      # nobody noticed" — both are a container that is not there. What stops
      # that being silent is that the FACT outlives the ALERT: the dashboard
      # keeps reporting a configured-but-absent target (see roadmap G3), so it
      # stops nagging without being forgotten.
      #
      # The job list is the ENGINES, and the two rules must stay complements of
      # each other: a job in neither would never alert at all, and a job in
      # both would alert twice with different ageing rules.
      - alert: InferenceTargetScrapeFailing
        expr: >-
          up{job=~"vllm|sglang"} == 0
          and max_over_time(up{job=~"vllm|sglang"}[24h]) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} on {{ $labels.instance }}"
          description: >-
            An inference endpoint has stopped responding. Resolves itself if it
            stays down for 24 hours, on the assumption the model was retired —
            the dashboard will still show it as configured but absent. If it
            was NOT deliberate, that is the window to act in.
