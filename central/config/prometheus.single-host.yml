# Central Prometheus, SINGLE-HOST variant — everything on one GB10.
#
# Used only through compose.single-host.yaml, which points --config.file here.
#
# `alerts.yml` is NOT duplicated: it stays shared through the same config/
# mount. Only the one host-pinned storage rule has a variant, and only the
# `node-exporter-central` job differs from prometheus.yml.
# tests/test_single_host.py asserts exactly that, because a second copy of a
# scrape config is a drift hazard and the drift should be checked rather than
# hoped about.
#
# Read docs/deployment.md#single-host before using this: the failure domain
# collapses, and that is an accepted trade rather than an oversight.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: spark-dash

# Alert rules live in their own file so tuning a threshold is a small, obvious
# diff rather than an edit buried in scrape config.
# Under config/ with this file, which is mounted as a DIRECTORY. That is
# load-bearing: a single-file bind mount follows the inode, so replacing
# alerts.yml (which is what git does) left the container reading the old one
# while the host showed the new. A directory mount resolves each entry on
# access, so an edited rule takes effect on the next reload.
rule_files:
  - /etc/prometheus/config/alerts.yml
  # The one host-pinned rule, split out because the host it pins to
  # differs between layouts. See the file's own header.
  - /etc/prometheus/config/alerts-storage.single-host.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Our per-node agent: GPU, unified memory, PSI, clock state, router models.
  # The agent already labels every series with `node`, so nothing is relabeled
  # here — see the note on honor_labels below.
  - job_name: spark-dash-agent
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/agents.yml]
        refresh_interval: 30s
    # The agent is the authority on its own node identity (NODE_ID), so its
    # labels win over anything derived from the target address. Prevents a
    # renamed DNS entry from silently splitting a node's history in two.
    honor_labels: true

  # Stock host metrics. Separate job because it's a different port, and
  # because its failure is independent — node_exporter being down shouldn't
  # look like the agent being down.
  - job_name: node-exporter
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/node-exporters.yml]
        refresh_interval: 30s

  # vLLM exposes Prometheus metrics natively, so it's scraped directly rather
  # than through the agent. Left empty until vLLM instances are running.
  # GENERATED, like agents and node-exporters — see the note at the top of
  # this file about which directory is whose.
  #
  # It was hand-maintained in config/vllm-targets.yml, which made cluster.yml
  # and that file two independent sources for one fact. Retiring an endpoint
  # from the dashboard removed it from cluster.yml so the AGENT stopped polling
  # it, while Prometheus went on scraping from the other file — the alert and
  # the "configured but absent" banner correctly returned, and the button
  # looked broken. One source removes the class of bug rather than the
  # instance.
  - job_name: vllm
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/vllm.yml]
        refresh_interval: 30s

  # SGLang, the same way: it exposes Prometheus natively with
  # `--enable-metrics`, so it is scraped directly and its targets are
  # generated from cluster.yml alongside vLLM's.
  #
  # A JOB PER ENGINE, not one `inference` job carrying both. The two publish
  # differently-named series — `vllm:num_requests_running` against
  # `sglang:num_running_reqs` — so a single job label would put targets with
  # incompatible metrics behind one selector, and every rule would have to
  # re-derive which engine it was looking at. It is also what lets the retire
  # button name the engine it is retiring from.
  - job_name: sglang
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/sglang.yml]
        refresh_interval: 30s

  # Prometheus scraping itself — cheap, and it's how you notice the monitoring
  # host is struggling before it starts dropping samples.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager's own health. An alerting system that's down is exactly the
  # thing no alert would otherwise tell you about.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # NO `node-exporter-central` JOB HERE, and that is the point of this file.
  #
  # The multi-host layout scrapes an exporter of its own inside the compose
  # network, labelled `node: sparkmon`. On one box that would invent a node
  # that does not exist — roughly 640 series describing the GB10 under a
  # different machine's name, in the same label space as the real one, so every
  # `by (node)` query gains a phantom member.
  #
  # It is not re-pointed at the node stack's exporter either: that exporter is
  # already scraped by the `node-exporter` job above, and scraping one target
  # under two job names duplicates ~4,750 series to no purpose.
  #
  # The rule that needed the job name (`PrometheusStorageFillingUp`) is loaded
  # from alerts-storage.single-host.yml instead, which drops the pin because
  # with one host there is exactly one root filesystem to compare against.
