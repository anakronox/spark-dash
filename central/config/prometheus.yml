# Central Prometheus — runs on the monitoring VM, never on a GX10.
#
# Targets come from files rather than being listed here, so adding a node needs
# no Prometheus config change and no restart — file_sd is re-read automatically.
#
# Targets come from two places, by who writes them:
#   targets/             rendered by the backend from cluster.yml — never edited
#   config/vllm-targets.yml   hand-maintained in this repo
#
# The hand-maintained ones live in config/ rather than a second targets
# directory. Sharing one directory is not possible — the backend's mount would
# hide the repo's own file — and a separate targets/static made the generated
# directory need a path variable to stay distinct. Filing them by AUTHOR
# instead of by purpose removes the collision: config/ is what git tracks,
# targets/ is what the backend writes.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: spark-dash

# Alert rules live in their own file so tuning a threshold is a small, obvious
# diff rather than an edit buried in scrape config.
# Under config/ with this file, which is mounted as a DIRECTORY. That is
# load-bearing: a single-file bind mount follows the inode, so replacing
# alerts.yml (which is what git does) left the container reading the old one
# while the host showed the new. A directory mount resolves each entry on
# access, so an edited rule takes effect on the next reload.
rule_files:
  - /etc/prometheus/config/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Our per-node agent: GPU, unified memory, PSI, clock state, router models.
  # The agent already labels every series with `node`, so nothing is relabeled
  # here — see the note on honor_labels below.
  - job_name: spark-dash-agent
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/agents.yml]
        refresh_interval: 30s
    # The agent is the authority on its own node identity (NODE_ID), so its
    # labels win over anything derived from the target address. Prevents a
    # renamed DNS entry from silently splitting a node's history in two.
    honor_labels: true

  # Stock host metrics. Separate job because it's a different port, and
  # because its failure is independent — node_exporter being down shouldn't
  # look like the agent being down.
  - job_name: node-exporter
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/node-exporters.yml]
        refresh_interval: 30s

  # vLLM exposes Prometheus metrics natively, so it's scraped directly rather
  # than through the agent. Left empty until vLLM instances are running.
  # GENERATED, like agents and node-exporters — see the note at the top of
  # this file about which directory is whose.
  #
  # It was hand-maintained in config/vllm-targets.yml, which made cluster.yml
  # and that file two independent sources for one fact. Retiring an endpoint
  # from the dashboard removed it from cluster.yml so the AGENT stopped polling
  # it, while Prometheus went on scraping from the other file — the alert and
  # the "configured but absent" banner correctly returned, and the button
  # looked broken. One source removes the class of bug rather than the
  # instance.
  - job_name: vllm
    file_sd_configs:
      - files: [/etc/prometheus/targets/generated/vllm.yml]
        refresh_interval: 30s

  # Prometheus scraping itself — cheap, and it's how you notice the monitoring
  # host is struggling before it starts dropping samples.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager's own health. An alerting system that's down is exactly the
  # thing no alert would otherwise tell you about.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # This host's own metrics. Separate job name from the per-node exporters so
  # rules can address the monitoring VM specifically — without it, a rule
  # joining on `node_filesystem_*` picks up whichever host happens to report,
  # which is how PrometheusStorageFillingUp ended up measuring the GX10's disk.
  - job_name: node-exporter-central
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: sparkmon
