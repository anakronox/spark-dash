# SUPERSEDED — no longer read by Prometheus.
#
# vLLM scrape targets are now GENERATED into targets/vllm.yml from cluster.yml,
# the same way agents.yml and node-exporters.yml are. Prometheus reads that
# file; this one is inert.
#
# Why it changed: this file and cluster.yml were two independent sources for
# one fact. Retiring an endpoint from the dashboard removed it from cluster.yml
# so the agent stopped polling it, while Prometheus kept scraping from here —
# the target never went away, the "configured but absent" banner correctly came
# back, and the retire button looked broken.
#
# To add or remove a vLLM endpoint, edit cluster.yml. An endpoint that does not
# live on a node's own address is still expressible there: a runtime entry
# accepts a full URL as well as a bare port.
#
# Kept rather than deleted so that a deploy which has not yet picked up the new
# prometheus.yml finds an empty list here instead of a missing file.
[]
