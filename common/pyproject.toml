[project]
name = "spark-dash-common"
version = "0.1.0"
description = "Shared metric models and helpers for spark-dash"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_dash_common"]
