# Alertmanager routing.
#
# Grouped by node so a node going down produces one notification rather than
# one per metric that stopped arriving.
#
# Notifications go to ntfy, via Alertmanager's generic webhook. ntfy has a
# built-in `alertmanager` template that turns the webhook JSON into a readable
# notification, so no bridge container is needed — the topic URL just needs
# `?template=alertmanager` on it.
#
# ntfy.sh is a free public service — no account, no API key. You invent a topic
# name and subscribe to it in an app. See README.md for setup.
#
# THE URL IS READ FROM A FILE, NOT FROM THIS CONFIG. On ntfy.sh the topic name
# is the ONLY access control: anyone who knows or guesses it can read your
# alerts and send you their own. Your alerts name nodes, IPs and models, and
# this repo is public — so the URL lives on the host instead:
#
#   $DATA_ROOT/secrets/ntfy-url
#
# Alertmanager has no environment-variable expansion, so `url_file` is the
# mechanism for this rather than a ${VAR} placeholder.

global:
  resolve_timeout: 5m

route:
  # One notification per (alert, node) rather than per firing series.
  group_by: ['alertname', 'node']

  # Wait briefly before sending, so a node going down batches its alerts
  # together instead of arriving as a burst.
  group_wait: 45s
  group_interval: 5m

  # How often an unresolved alert repeats. Long, on purpose: this is a homelab
  # and a nightly reminder of something you already know about is how
  # notifications get muted.
  repeat_interval: 12h

  receiver: ntfy

  routes:
    # Critical alerts use the same receiver but different timing: delivered
    # almost immediately and repeated more often. A throttled GPU or a node
    # down shouldn't wait out the 45s batching window.
    - matchers:
        - severity = "critical"
      receiver: ntfy
      group_wait: 10s
      repeat_interval: 4h

inhibit_rules:
  # A node that's down will also stop reporting temperature, clocks and
  # pressure. Without this you'd get one useful alert and a pile of noise
  # describing the same outage.
  - source_matchers:
      - alertname = "NodeAgentDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ['node']

  # Critical supersedes warning for the same condition on the same node.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'node']

receivers:
  - name: ntfy
    webhook_configs:
      # Contains the topic URL, including ?template=alertmanager. See the note
      # at the top — this is deliberately not inlined.
      - url_file: /etc/alertmanager/secrets/ntfy-url
        # Notify on recovery too. Knowing a node came back matters as much as
        # knowing it went away, and without this a resolved alert just goes
        # quiet — indistinguishable from you having missed it.
        send_resolved: true

# ---------------------------------------------------------------------------
# A NOTE ON SECRETS
#
# This file is in git and the repo is public, so it must never contain a
# credential OR a capability URL. An ntfy topic is both readable and writable by
# anyone who knows it, which is why it's read from $DATA_ROOT/secrets/ntfy-url
# rather than written here.
#
# The same applies to anything added later: SMTP and similar support
# `auth_password_file`, and webhooks support `url_file`. Use those rather than
# inlining a value.
# ---------------------------------------------------------------------------
