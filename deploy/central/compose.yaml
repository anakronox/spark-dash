# Central monitoring stack — runs on a dedicated Proxmox VM, never on a GX10.
# Deployed by Dockhand from git.
#
# The reasoning is failure domains, not resources: "node down" is a primary
# alert, so hosting Prometheus on node 1 means a node-1 crash destroys both the
# node and the history explaining why. See docs/deployment.md.
#
# ADDING A NODE: edit SPARK_NODES in .env, then `docker compose up -d backend`.
# That is the only place the cluster is defined. The backend renders
# Prometheus's scrape targets from it, and Prometheus picks them up on its next
# file_sd refresh without restarting.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sparkdash-prometheus
    restart: unless-stopped
    # Runs as `nobody` (65534) by default, which will not be able to write to a
    # bind-mounted host directory owned by anyone else — Prometheus panics on
    # startup with "Unable to create mmap-ed active query log". Set PUID/PGID
    # to whatever owns DATA_ROOT rather than chowning host dirs to 65534.
    user: "${PUID:-65534}:${PGID:-65534}"
    command:
      - '--config.file=/etc/prometheus/config/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Generous for now — real retention gets set in Phase 3 from observed
      # disk usage rather than guessed here.
      - '--storage.tsdb.retention.time=${PROM_RETENTION:-30d}'
      - '--web.enable-lifecycle'
    volumes:
      # Config comes from git (this stack dir, synced by hawser). Data and
      # generated files go under DATA_ROOT so they're visible and backup-able
      # rather than buried in /var/lib/docker.
      # A DIRECTORY, not three single files. Single-file bind mounts follow
      # the INODE: `git pull` replaces a file rather than editing it, so the
      # container kept reading the old inode while the host showed the new
      # content — measured here, host inode 2391 against container 430115,
      # with a plain `up -d` reporting "Running" and changing nothing. The
      # failure was silent in the worst way: Prometheus reported a clean
      # reload and simply didn't have the rule.
      #
      # A directory mount resolves each entry on access, so a replaced file is
      # picked up without recreating the container — which is exactly why
      # targets/vllm.yml worked first time while alerts.yml did not.
      - ./config:/etc/prometheus/config:ro
      # Two target directories, deliberately separate. A single directory
      # can't work: the generated mount would hide the stack dir's own files,
      # so hand-maintained targets would silently never be scraped.
      #
      #   generated/  written by the backend from SPARK_NODES
      #   static/     hand-maintained in git (vLLM instances)
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/targets:/etc/prometheus/targets/generated:ro
      - ./targets:/etc/prometheus/targets/static:ro
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/prometheus:/prometheus
    ports:
      # LAN-reachable. Prometheus has no auth of its own, so this relies on the
      # LAN being the trust boundary — which it is here: only the dashboard on
      # :8080 is published through the Cloudflare tunnel, and this port never
      # leaves the network. Set PROM_BIND=127.0.0.1 to restrict it further.
      - "${PROM_BIND:-0.0.0.0}:9090:9090"
    networks:
      - sparkdash

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: sparkdash-alertmanager
    restart: unless-stopped
    user: "${PUID:-65534}:${PGID:-65534}"
    command:
      - '--config.file=/etc/alertmanager/config/alertmanager.yml'
      - '--storage.path=/alertmanager'
      # Needed for links in notifications to be clickable rather than pointing
      # at a container-internal hostname.
      - '--web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}'
    volumes:
      # Directory mount, same reasoning as Prometheus above.
      - ./config:/etc/alertmanager/config:ro
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/alertmanager:/alertmanager
      # The ntfy topic URL, kept off git — see alertmanager.yml.
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/secrets:/etc/alertmanager/secrets:ro
    ports:
      # LAN-reachable, same reasoning as Prometheus. Mainly used for silencing
      # an alert while you work on it; firing alerts show in the dashboard.
      - "${ALERTMANAGER_BIND:-0.0.0.0}:9093:9093"
    networks:
      - sparkdash

  backend:
    image: ${BACKEND_IMAGE:-forgejo.indielab.tech/brian/spark-dash-backend:latest}
    container_name: sparkdash-backend
    restart: unless-stopped
    # Same reasoning as prometheus: it writes the generated scrape targets, so
    # it needs write access to DATA_ROOT/targets. The image's own user is
    # 10002; PUID overrides it to match the host.
    user: "${PUID:-10002}:${PGID:-10002}"
    depends_on:
      - prometheus
      - alertmanager
    environment:
      # ---- the only place nodes are defined ----
      #   SPARK_NODES=gx10-1=192.168.50.61,gx10-2=192.168.50.62
      - SPARK_NODES=${SPARK_NODES:?set SPARK_NODES in .env}
      - AGENT_PORT=${AGENT_PORT:-9500}
      - NODE_EXPORTER_PORT=${NODE_EXPORTER_PORT:-9100}

      - PROMETHEUS_URL=http://prometheus:9090
      - ALERTMANAGER_URL=http://alertmanager:9093
      - PROMETHEUS_TARGETS_DIR=/etc/prometheus/targets/generated
      - LIVE_POLL_INTERVAL_S=${LIVE_POLL_INTERVAL_S:-2.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Writable here — this is the service that renders the target files.
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/targets:/etc/prometheus/targets/generated
      # The cluster definition. A DIRECTORY mount, not a file: single-file
      # mounts follow the inode, and any safe write (write-temp-then-rename,
      # which is what the retire-endpoint UI will do) replaces it — leaving the
      # container reading the old one. That failure is silent, and it cost most
      # of 2026-08-16 to find in Prometheus's config.
      #
      # Its own directory rather than the stack root, so mounting it does not
      # also expose .env to the container.
      #
      # NOT read-only: G4 will have the dashboard retire a decommissioned
      # endpoint by removing it from here.
      - ${DATA_ROOT:-/docker/spark-dash-stack-central}/cluster:/etc/spark-dash
    ports:
      # The dashboard. THE ONLY PORT PUBLISHED THROUGH THE CLOUDFLARE TUNNEL —
      # Prometheus and Alertmanager stay LAN-only, so Google OAuth at the
      # tunnel edge guards the whole externally-reachable surface.
      - "${BACKEND_BIND:-0.0.0.0}:8080:8080"
    networks:
      - sparkdash

  # The monitoring VM was monitoring everything except itself. Without this it
  # reported no disk, CPU or memory metrics at all — and PrometheusStorageFillingUp,
  # the rule meant to catch the TSDB filling the disk, was silently comparing
  # against the GX10's 3.6TB root filesystem (the only one reporting) rather
  # than this host's 50GB. It could never have fired.
  #
  # Same image and flags as the per-node stack, so there is one thing to reason
  # about rather than two.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sparkdash-central-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    # Not published: only Prometheus on this host scrapes it, over the compose
    # network. The per-node exporters publish 9100 because they're scraped
    # across the LAN; this one has no reason to be reachable off-box.
    networks:
      - sparkdash

# No named volumes: everything persistent is a bind mount under DATA_ROOT, so
# it can be found, inspected and backed up without docker volume commands.
#
# The containers run as non-root. Set PUID/PGID in .env to the uid that owns
# DATA_ROOT and they will all be able to write there; otherwise they default to
# their images' own users (65534 for Prometheus and Alertmanager, 10002 for the
# backend) and the host directories need to be owned accordingly.

networks:
  sparkdash:
    driver: bridge

# cloudflared is intentionally NOT defined here. It already runs on this host
# for other services; adding a route for the dashboard is a tunnel config
# change, not a second connector to maintain.
