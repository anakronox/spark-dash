# spark-dash-agent scrape targets — Prometheus file_sd format.
#
# THIS FILE IS ALSO READ BY THE BACKEND, which derives its live-poll targets
# from it. One inventory, so the two can't drift into disagreeing about which
# nodes exist.
#
# Adding a node is one entry here plus one in node-exporters.yml. Prometheus
# re-reads this automatically; no restart.
#
# The `node` label must match the agent's NODE_ID. It's set here so a target
# that is down still has an identity — otherwise a node that never came up
# would be invisible rather than visibly missing.

- targets: ['192.168.50.61:9500']
  labels:
    node: gx10-1

