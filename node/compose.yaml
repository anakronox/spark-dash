# Per-node monitoring stack for a GX10. Cloned from git and started by hand.
#
# Identical on all three nodes, with nothing to change per node: the agent
# derives its id from the host's hostname. That's the whole Phase 2 rollout
# story — clone the repo on the new node, `cd node`, `up -d`, and it works.
#
# Host preconditions: Docker Engine and the NVIDIA Container Toolkit. Both are
# already present for the existing GPU-enabled inference containers, so this
# adds nothing to the base OS.
#
# Images come from the Forgejo container registry rather than being built here
# — nothing here builds them. See scripts/publish-images.sh.

# Project name pinned rather than derived from the directory. Compose defaults
# it to the folder name, so moving or renaming this directory would silently
# start a SECOND project with the same container_names and fail on a name
# conflict — which is exactly what happened moving this stack out of the old
# per-stack repo. Pinning it means the containers belong to `spark-dash-node`
# no matter where the checkout lives.
name: spark-dash-node

# NO RELATIVE PATHS HERE AT ALL, and nothing to configure per node: every
# mount below is an absolute HOST path (/proc, /sys, /etc/hostname, /), because
# what this stack reads is the machine itself. There is no data directory to
# create and nothing to point anywhere — which is why `compose.yaml` is the
# only file this stack needs, and why the same one deploys unchanged to every
# GX10. See central/compose.yaml for why THAT stack uses relative paths.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sparkdash-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # The host's hostname, used as the node id. Must be /etc/hostname, NOT
      # /proc/sys/kernel/hostname — the procfs entry is UTS-namespace-aware and
      # returns the CONTAINER's hostname even through a bind-mounted /proc,
      # which is Docker's container id by default.
      - /etc/hostname:/host/etc/hostname:ro
      - /:/rootfs:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - sparkdash

  spark-dash-agent:
    image: ${AGENT_IMAGE:-forgejo.indielab.tech/brian/spark-dash-agent:latest}
    # :latest is the norm; pinning is the exception (see .env.example).
    #
    # pull_policy MATTERS with a floating tag. Compose's default is `missing`:
    # if ANY image with this tag already exists locally it is used and the
    # registry is never contacted — so a node would keep running whatever it
    # first pulled, forever, and a deploy would report success having changed
    # nothing. Measured, not assumed.
    #
    # Set only on OUR image. A blanket `--pull always` would also re-pull the
    # pinned third-party images, so a transient registry blip would fail a
    # deploy that only needed to move our own container.
    #
    # Consequence worth knowing: `publish-images.sh --no-push` builds an image
    # this will then ignore, because it always prefers the registry. Pin that
    # build's sha to run it.
    pull_policy: always
    container_name: sparkdash-agent
    restart: unless-stopped

    # NVML access via the Container Toolkit. No CUDA runtime is installed in
    # the image — it only reads telemetry from the host driver.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]

    # Required for per-process GPU attribution: NVML returns HOST pids, so
    # without the host PID namespace they can't be resolved to process names
    # and the process table would show bare numbers.
    pid: "host"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # The host's hostname, used as the node id. Must be /etc/hostname, NOT
      # /proc/sys/kernel/hostname — the procfs entry is UTS-namespace-aware and
      # returns the CONTAINER's hostname even through a bind-mounted /proc,
      # which is Docker's container id by default.
      - /etc/hostname:/host/etc/hostname:ro

    environment:
      # Optional. Left unset, the agent uses the HOST's hostname, read from
      # the mounted procfs — so this file deploys unchanged to every GX10 and
      # one stack repo serves the whole cluster. Set it only if a node's
      # hostname is a poor label.
      - NODE_ID=${NODE_ID:-}

      # Read the host's view, not the container's — a container's
      # /proc/pressure/memory and MemAvailable describe the container.
      - PROC_PATH=/host/proc
      - SYS_PATH=/host/sys
      - HOSTNAME_PATH=/host/etc/hostname

      # Where this node fetches its runtime config from.
      #
      # THE SAME ON EVERY NODE — it names the monitoring VM, not the node —
      # which is exactly what lets this file deploy unchanged to all three
      # GX10s. The node asks what it serves instead of carrying it.
      - BACKEND_URL=${BACKEND_URL:-}

      # The three below are now FALLBACKS, used only while a node is not yet
      # listed in cluster.yml on the monitoring VM. Once it is, central config
      # wins and these are ignored — see remote_config.py for the precedence.
      #
      # Comma-separated: a node commonly runs several router containers.
      # Leave blank on a node that serves only vLLM.
      - LLAMA_ROUTER_URLS=${LLAMA_ROUTER_URLS:-}

      # Opt-in allowlist for /metrics?model= requests, which LOAD the model on
      # an autoload router. Empty means no such request is ever issued.
      - LLAMA_METRICS_ROUTERS=${LLAMA_METRICS_ROUTERS:-}

      # Comma-separated vLLM /metrics endpoints on this node.
      - VLLM_URLS=${VLLM_URLS:-}

      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    ports:
      - "9500:9500"

    networks:
      - sparkdash

networks:
  sparkdash:
    driver: bridge

# Deliberately does NOT join the inference containers' network. The agent
# reaches the routers and vLLM by host address (see LLAMA_ROUTER_URLS in .env),
# which works from a plain bridge network and means this stack has no external
# dependency to declare — one less thing that has to exist before it starts.
#
# If you'd rather address them by container name, add the runtimes' network as
# `external: true` here and switch those URLs to service names. Note that
# hard-couples this stack to that network existing first.
