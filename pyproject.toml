[tool.uv.workspace]
members = ["common", "agent", "backend"]

[tool.uv.sources]
spark-dash-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "agent/tests", "backend/tests"]
asyncio_mode = "auto"
