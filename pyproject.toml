[tool.uv.workspace]
members = ["common", "agent", "backend"]

[tool.uv.sources]
spark-dash-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The DGX OS updater's engine, moved in from its own repo at AL3a and written
# in that project's denser style: semicolons, long single-purpose lines, a
# bare `OPTIONS` guarded by NameError in the script that gets piped to a
# node's interpreter.
#
# THE STATED SUNSET FOR THIS ARRIVED AT AL3g AND WAS DECLINED, which is worth
# more than quietly leaving it. The original reason was that the code had to
# stay diffable against the upstream repo; archiving that repo ended it. But
# clearing the list means 145 hand edits -- 114 line wraps and 31 semicolon
# splits -- to code that reboots machines and had just run a real update on
# one. That is real risk bought with nothing but consistency.
#
# What was taken instead: every fix ruff could make on its own (22 of them --
# import order, `datetime.UTC`, compound imports), leaving only the rules that
# need a human to retype a working line. The list below is therefore shorter
# than it was and each entry now costs a manual edit.
#
# REVISIT WHEN one of these files is being substantially rewritten anyway. The
# churn is only dangerous when it is the whole point of the change.
"backend/src/spark_dash_backend/fleet/*.py" = [
    "E501",   # long lines
    "E701",   # `if x: return` on one line
    "E702",   # `a = 1; b = 2`
    "E741",   # `l` as a loop variable
    "SIM105", # try/except/pass rather than contextlib.suppress
    "B018",   # the `OPTIONS` NameError probe in node_collect.py
]
# Its test came across with it, in the same style.
"backend/tests/test_fleet_posture.py" = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "agent/tests", "backend/tests", "tests"]
# `tests/` holds repo-level checks that are not any one package's logic —
# the theme palette validation reads frontend/src/app.css directly.
pythonpath = ["scripts"]
asyncio_mode = "auto"
