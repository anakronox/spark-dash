[tool.uv.workspace]
members = ["common", "agent", "backend"]

[tool.uv.sources]
spark-dash-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The fleet updater's engine, moved in from its own repo in AL3a module for
# module. It is written in that project's denser style -- semicolons, long
# single-purpose lines, a bare `OPTIONS` guarded by NameError in the script
# that gets piped to a node's interpreter -- and reformatting it to this
# repo's rules would mean ~190 edits across nine files, which is exactly the
# diff that would stop anyone checking the move was faithful.
#
# SUNSET: this block goes when AL3g archives spark-fleet-updates. At that
# point there is no upstream left to diff against, and the code becomes
# ordinary backend code held to the ordinary rules. Anything genuinely wrong
# rather than merely unlike us is fixed in BOTH copies while both exist, so
# they stay byte-identical -- that is why F401 is not on this list.
"backend/src/spark_dash_backend/fleet/*.py" = [
    "E401",   # `import json, os, subprocess` -- the piped collector keeps its header compact
    "E501",   # long lines
    "E701",   # `if x: return` on one line
    "E702",   # `a = 1; b = 2`
    "E741",   # `l` as a loop variable
    "I001",   # import block ordering
    "UP017",  # datetime.timezone.utc rather than datetime.UTC
    "SIM105", # try/except/pass rather than contextlib.suppress
    "B018",   # the `OPTIONS` NameError probe in node_collect.py
]
# Its test came across with it and is the same ported code in the same style.
# Only its imports and fixture path were rewritten, which is what the move is.
"backend/tests/test_fleet_posture.py" = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "agent/tests", "backend/tests", "tests"]
# `tests/` holds repo-level checks that are not any one package's logic —
# the theme palette validation reads frontend/src/app.css directly.
pythonpath = ["scripts"]
asyncio_mode = "auto"
